<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#05060a;color:#fff;font-family:Inter,system-ui;min-height:100vh;display:grid;place-items:center}.card{width:min(430px,92vw);padding:32px;border:1px solid #252d3d;border-radius:30px;background:#0c0f18;box-shadow:0 25px 100px #0008;animation:up .5s ease}input{width:100%;padding:15px;border-radius:15px;background:#07090f;border:1px solid #222c3e;color:#fff;outline:0}button{width:100%;padding:15px;border:0;border-radius:15px;background:linear-gradient(100deg,#ff5a1f,#ff2e55);color:#fff;font-weight:900}@keyframes up{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}</style></head><body><div class="card"><img src="/static/logo.png" class="w-20 h-20 rounded-full mx-auto"><h1 class="text-2xl font-black text-center mt-4">CREATE ACCOUNT</h1><div id="msg" class="hidden mt-4 p-3 rounded-xl bg-red-500/10 text-red-300 text-sm"></div><div class="space-y-3 mt-6"><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password (6+ characters)"><input id="c" type="password" placeholder="Confirm password"><button onclick="go()">CREATE ACCOUNT</button></div><a href="/login" class="block text-center text-gray-500 mt-5">← Login</a></div><script>async function go(){if(p.value!==c.value)return show('Passwords do not match');let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let d=await r.json();if(d.status==='success')location='/login';else show(d.message)}function show(x){msg.textContent=x;msg.classList.remove('hidden')}</script></body></html>

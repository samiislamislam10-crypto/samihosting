<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAMI-YT | Login</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- ================= Google AdSense Script ================= -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3618481233219616" crossorigin="anonymous"></script>
  <!-- ======================================================== -->

  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
    body { background-color: #030712; color: #f9fafb; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; position: relative; }
    .glow-bg { position: absolute; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
    .glow-1 { width: 400px; height: 400px; background: rgba(255, 90, 31, 0.18); top: -100px; left: -100px; animation: float 10s ease-in-out infinite alternate; }
    .glow-2 { width: 350px; height: 350px; background: rgba(99, 102, 241, 0.15); bottom: -80px; right: -80px; animation: float 12s ease-in-out infinite alternate-reverse; }
    @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(60px, 80px) scale(1.1); } }
    .login-card { position: relative; z-index: 10; width: min(440px, 92vw); background: rgba(17, 24, 39, 0.65); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 28px; box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7); animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .input-field { background: rgba(3, 7, 18, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.25s ease; }
    .input-field:focus-within { border-color: #ff5a1f; box-shadow: 0 0 0 4px rgba(255, 90, 31, 0.15); background: rgba(3, 7, 18, 0.85); }
    .btn-gradient { background: linear-gradient(135deg, #ff5a1f 0%, #e11d48 100%); transition: all 0.25s ease; box-shadow: 0 8px 25px -6px rgba(255, 90, 31, 0.4); }
    .btn-gradient:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 30px -4px rgba(255, 90, 31, 0.5); filter: brightness(1.08); }
    .spinner { border: 2.5px solid rgba(255, 255, 255, 0.3); border-top-color: #ffffff; border-radius: 50%; width: 18px; height: 18px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="glow-bg glow-1"></div>
  <div class="glow-bg glow-2"></div>

  <div class="login-card p-8 sm:p-10 my-8">
    
    <div class="text-center">
      <div class="relative inline-block">
        <img src="/static/logo.png" onerror="this.src='https://ui-avatars.com/api/?name=SAMI+YT&background=ff5a1f&color=fff'" class="w-20 h-20 rounded-2xl mx-auto object-cover ring-4 ring-orange-500/20 shadow-lg">
        <span class="absolute -bottom-1 -right-1 flex h-4 w-4">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-4 w-4 bg-emerald-500 border-2 border-gray-900"></span>
        </span>
      </div>
      
      <h1 class="text-3xl font-extrabold tracking-tight mt-4">
        SAMI-<span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-rose-500">YT</span>
      </h1>
      <p class="text-xs font-medium text-gray-400 mt-1 uppercase tracking-widest">Multi-User Control Panel</p>
    </div>

    <div id="msg" class="hidden mt-6 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-sm font-medium flex items-center gap-2.5">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
      <span id="msg-text"></span>
    </div>

    <form onsubmit="go(event)" class="space-y-4 mt-6">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Username</label>
        <div class="input-field flex items-center rounded-xl px-3.5 py-3">
          <i data-lucide="user" class="w-5 h-5 text-gray-400 shrink-0"></i>
          <input id="u" type="text" required placeholder="Enter username..." class="w-full bg-transparent border-0 outline-none text-sm text-white pl-3 placeholder-gray-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Password</label>
        <div class="input-field flex items-center rounded-xl px-3.5 py-3">
          <i data-lucide="lock" class="w-5 h-5 text-gray-400 shrink-0"></i>
          <input id="p" type="password" required placeholder="••••••••" class="w-full bg-transparent border-0 outline-none text-sm text-white pl-3 placeholder-gray-500">
          <button type="button" onclick="togglePassword()" class="text-gray-400 hover:text-white transition-colors focus:outline-none">
            <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <button id="btn" type="submit" class="btn-gradient w-full py-3.5 rounded-xl text-white font-bold text-sm tracking-wide flex items-center justify-center gap-2 mt-2">
        <span id="btn-text">SIGN IN</span>
        <div id="btn-spinner" class="spinner hidden"></div>
      </button>
    </form>

    <div class="mt-6 pt-5 border-t border-white/5 text-center space-y-3">
      <a href="/register" class="inline-flex items-center gap-1.5 text-sm text-orange-400 hover:text-orange-300 font-semibold transition-colors">
        Create new account <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </a>
      <div class="p-2.5 rounded-lg bg-white/[0.02] border border-white/5 text-[11px] text-gray-400">
        Default Admin: <span class="text-orange-400 font-mono">admin</span> / <span class="text-orange-400 font-mono">changeme123</span>
      </div>
    </div>

    <!-- ================= Google AdSense Ad Block ================= -->
    <div class="mt-6 p-2 rounded-xl bg-gray-900/40 border border-white/5 text-center">
      <p class="text-[9px] text-gray-500 uppercase tracking-widest mb-1">Advertisement</p>
      
      <!-- Ad by sami -->
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-3618481233219616"
           data-ad-slot="3232184448"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>
    <!-- ========================================================= -->

  </div>

  <script>
    lucide.createIcons();

    function togglePassword() {
      const pInput = document.getElementById('p');
      const eyeIcon = document.getElementById('eye-icon');
      if (pInput.type === 'password') {
        pInput.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        pInput.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    async function go(e) {
      e.preventDefault();
      const u = document.getElementById('u').value.trim();
      const p = document.getElementById('p').value;
      const msg = document.getElementById('msg');
      const msgText = document.getElementById('msg-text');
      const btn = document.getElementById('btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      msg.classList.add('hidden');
      btn.disabled = true;
      btnText.textContent = "AUTHENTICATING...";
      btnSpinner.classList.remove('hidden');

      try {
        let r = await fetch('/api/login_auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        
        let d = await r.json();

        if (d.status === 'success') {
          btnText.textContent = "SUCCESS! REDIRECTING...";
          location.href = '/';
        } else {
          msgText.textContent = d.message || "Invalid username or password.";
          msg.classList.remove('hidden');
          btn.disabled = false;
          btnText.textContent = "SIGN IN";
          btnSpinner.classList.add('hidden');
        }
      } catch (err) {
        msgText.textContent = "Network error. Please try again.";
        msg.classList.remove('hidden');
        btn.disabled = false;
        btnText.textContent = "SIGN IN";
        btnSpinner.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
